<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title desc"><title id="title">Static site generation and deployment</title><desc id="desc">Editable sources and site configuration feed the Python generator, which produces public HTML and assets. Local checks and optional CI validate the output; Cloudflare serves it to visitors.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7z" fill="#6bdc9c"/></marker></defs><rect width="1000" height="260" rx="12" fill="#0a1310"/><g fill="#10251a" stroke="#38694d" stroke-width="1.5"><rect x="24" y="65" width="205" height="100" rx="8"/><rect x="275" y="65" width="195" height="100" rx="8"/><rect x="516" y="65" width="200" height="100" rx="8"/><rect x="762" y="65" width="214" height="100" rx="8"/><rect x="516" y="190" width="200" height="48" rx="7"/></g><g stroke="#6bdc9c" stroke-width="2" marker-end="url(#arrow)"><path d="M229 115H270"/><path d="M470 115H511"/><path d="M716 115H757"/><path d="M616 165V185"/></g><g font-family="monospace" text-anchor="middle"><g fill="#7af6a0" font-size="15" font-weight="bold"><text x="126" y="91">01 / SOURCES</text><text x="372" y="91">02 / GENERATE</text><text x="616" y="91">03 / PUBLIC</text><text x="869" y="91">04 / SERVE</text></g><g fill="#d5e9dc" font-size="13"><text x="126" y="118">src/ + site.json</text><text x="126" y="139">tools/build.py</text><text x="372" y="118">Python standard library</text><text x="372" y="139">Static generation</text><text x="616" y="118">HTML · CSS · JS</text><text x="616" y="139">SEO + assets</text><text x="869" y="118">Cloudflare Workers</text><text x="869" y="139">Visitors / crawlers</text><text x="616" y="219">Local checks + CI*</text></g><text x="24" y="28" text-anchor="start" font-size="14" fill="#a4b9a9">RUFUS TERMINAL / STATIC DELIVERY PIPELINE</text><text x="24" y="243" text-anchor="start" font-size="11" fill="#a4b9a9">* CI activates after the workflow is committed.</text></g></svg>
